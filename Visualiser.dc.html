<style>
body { margin: 0 }
a { color: #C8FF4D; text-decoration: none } a:hover { color: #E4FFA8 }
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B0D; color: #F4F2ED; font-family: 'Space Grotesk', system-ui, sans-serif; padding: 30px 22px 20px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 8px">
      <div style="width: 7px; height: 7px; border-radius: 50%; background: #C8FF4D"></div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em">THE BLEND · 6 PEOPLE</div>
    </div>
    <a href="Main.dc.html" style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #B9B9C4">ROOM</a>
  </div>

  <div style="flex-grow: 1; position: relative; border: 1px solid #1E1E26; border-radius: 8px; background: #0E0E12; overflow: hidden; display: flex; align-items: center; justify-content: center">

    <sc-if value="{{isBars}}" hint-placeholder-val="{{ true }}">
      <div style="width: 100%; height: 100%; box-sizing: border-box; padding: 24px; display: flex; align-items: center; gap: 5px">
        <sc-for list="{{bars}}" as="bar" hint-placeholder-count="18">
          <div style="flex: 1; height: {{bar.h}}; background: {{bar.color}}; border-radius: 1px"></div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{isRings}}" hint-placeholder-val="{{ false }}">
      <div style="position: relative; width: 300px; height: 300px">
        <sc-for list="{{rings}}" as="ring" hint-placeholder-count="6">
          <div style="position: absolute; top: {{ring.inset}}; right: {{ring.inset}}; bottom: {{ring.inset}}; left: {{ring.inset}}; border: {{ring.bw}} solid {{ring.color}}; border-radius: 50%"></div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{isWeave}}" hint-placeholder-val="{{ false }}">
      <div style="width: 100%; height: 100%; box-sizing: border-box; padding: 26px; display: flex; flex-direction: column; justify-content: center; gap: 10px">
        <sc-for list="{{ribbons}}" as="rib" hint-placeholder-count="8">
          <div style="width: {{rib.w}}; height: {{rib.h}}; margin-left: {{rib.offset}}; background: {{rib.color}}; border-radius: 2px"></div>
        </sc-for>
      </div>
    </sc-if>

    <div style="position: absolute; top: 14px; left: 16px; font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.14em; color: #8E8E9A">{{formLabel}} · {{bloomLabel}}</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 19px; font-weight: 700; letter-spacing: -0.01em">Night Bus (Slowed)</div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #FF8A4C">FROM NIGHT BUS · KOJO ÀSÉ · 11:11 SESSIONS</div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #C8FF4D">PULLED FROM LARA K.</div>
  </div>

  <div style="display: flex; gap: 8px">
    <button type="button" sc-camel-on-click="{{setBars}}" style="flex: 1; min-height: 44px; border-radius: 6px; cursor: pointer; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; background: {{barsBg}}; color: {{barsFg}}; border: 1px solid {{barsBc}}">BARS</button>
    <button type="button" sc-camel-on-click="{{setRings}}" style="flex: 1; min-height: 44px; border-radius: 6px; cursor: pointer; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; background: {{ringsBg}}; color: {{ringsFg}}; border: 1px solid {{ringsBc}}">RINGS</button>
    <button type="button" sc-camel-on-click="{{setWeave}}" style="flex: 1; min-height: 44px; border-radius: 6px; cursor: pointer; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; background: {{weaveBg}}; color: {{weaveFg}}; border: 1px solid {{weaveBc}}">WEAVE</button>
  </div>

  <div style="display: flex; gap: 8px; align-items: center">
    <button type="button" sc-camel-on-click="{{thinner}}" aria-label="Thin the visual out" style="width: 52px; min-height: 44px; flex: none; border-radius: 6px; background: transparent; border: 1px solid #2E2E3A; color: #F4F2ED; font-size: 18px; cursor: pointer">−</button>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 5px">
      <div style="height: 3px; background: #22222B; border-radius: 2px; overflow: hidden">
        <div style="height: 100%; background: #C8FF4D; width: {{densityWidth}}"></div>
      </div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.1em; color: #8E8E9A; text-align: center">DRAG TO THICKEN · {{densityLabel}}</div>
    </div>
    <button type="button" sc-camel-on-click="{{thicker}}" aria-label="Thicken the visual" style="width: 52px; min-height: 44px; flex: none; border-radius: 6px; background: transparent; border: 1px solid #2E2E3A; color: #F4F2ED; font-size: 18px; cursor: pointer">+</button>
    <button type="button" sc-camel-on-click="{{toggleBloom}}" aria-label="Hold to bloom" style="width: 52px; min-height: 44px; flex: none; border-radius: 6px; cursor: pointer; background: {{bloomBg}}; border: 1px solid {{bloomBc}}; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="20" height="20" sc-camel-view-box="0 0 20 20" role="img" aria-label="Bloom">
        <circle cx="10" cy="10" r="4" fill="{{bloomIcon}}"></circle>
        <circle cx="10" cy="10" r="8" fill="none" stroke="{{bloomIcon}}" stroke-width="1.1"></circle>
      </svg>
    </button>
  </div>

  <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.1em; color: #8E8E9A; text-align: center; line-height: 1.6">THE PICTURE CHANGES. THE AUDIO DOES NOT.</div>

</div>




</body></html>
