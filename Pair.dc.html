<!DOCTYPE html>
<html lang="en"><head><meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<meta name="description" content="FREQ interactive concept by Porto Labs. Room and music data are illustrative."><title>Pair, stitch to connect</title>

<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="screen.css"><script src="screen.js" defer></script></head>
<body>



<style>
body { margin: 0 }
a { color: #C8FF4D; text-decoration: none } a:hover { color: #E4FFA8 }
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B0D; color: #F4F2ED; font-family: 'Space Grotesk', system-ui, sans-serif; padding: 30px 22px 20px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #8E8E9A">PAIRING · BLUETOOTH</div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #C8FF4D">4 / 6</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 28px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em">Put the phones<br>together.</h1>
    <div style="font-size: 14px; color: #B9B9C4; line-height: 1.5">Hold them next to each other until they find each other. Everyone who joins drops in below. Nothing to tap, no codes to read out.</div>
  </div>

  <div style="position: relative; height: 226px; border: 1px solid #25252E; border-radius: 6px; background: #121217; box-sizing: border-box; padding: 20px; display: flex; align-items: center; justify-content: center; gap: 0">
    <div style="width: 104px; height: 176px; border: 1px solid #3A3A46; border-right: none; border-radius: 12px 0 0 12px; background: #16161C; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; justify-content: space-between">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.12em; color: #8E8E9A">YOU</div>
      <div style="display: flex; align-items: flex-end; gap: 3px; height: 40px">
        <div style="flex: 1; height: 50%; background: #32323C"></div>
        <div style="flex: 1; height: 80%; background: #32323C"></div>
        <div style="flex: 1; height: 35%; background: #32323C"></div>
        <div style="flex: 1; height: 65%; background: #32323C"></div>
      </div>
    </div>

    <div style="width: 2px; height: 176px; background: #C8FF4D; flex: none"></div>

    <div style="width: 104px; height: 176px; border: 1px solid #3A3A46; border-left: none; border-radius: 0 12px 12px 0; background: #16161C; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.12em; color: #8E8E9A">JD</div>
      <div style="display: flex; align-items: flex-end; gap: 3px; height: 40px; width: 100%">
        <div style="flex: 1; height: 70%; background: #32323C"></div>
        <div style="flex: 1; height: 40%; background: #32323C"></div>
        <div style="flex: 1; height: 90%; background: #32323C"></div>
        <div style="flex: 1; height: 55%; background: #32323C"></div>
      </div>
    </div>

    <div style="position: absolute; left: 104px; top: 88px; width: 182px; height: 92px">
      <svg width="182" height="92" viewBox="0 0 182 92" aria-hidden="true">
        <path d="M80 24 A24 24 0 0 0 80 68" fill="none" stroke="#C8FF4D" stroke-width="1.3"></path>
        <path d="M68 12 A36 36 0 0 0 68 80" fill="none" stroke="rgba(200,255,77,0.4)" stroke-width="1.1"></path>
        <path d="M102 24 A24 24 0 0 1 102 68" fill="none" stroke="#C8FF4D" stroke-width="1.3"></path>
        <path d="M114 12 A36 36 0 0 1 114 80" fill="none" stroke="rgba(200,255,77,0.4)" stroke-width="1.1"></path>
      </svg>
    </div>

    <div style="position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #C8FF4D">BLUETOOTH · A THUMP WHEN THEY FIND EACH OTHER</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #8E8E9A">STITCHED IN · CAP OF SIX</div>
    <div style="display: flex; gap: 8px">
      <div style="width: 44px; height: 44px; border-radius: 50%; background: #1C1C23; border: 1.5px solid #C8FF4D; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #C8FF4D">RO</div>
      <div style="width: 44px; height: 44px; border-radius: 50%; background: #1C1C23; border: 1px solid #2A2A33; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: #B9B9C4">LK</div>
      <div style="width: 44px; height: 44px; border-radius: 50%; background: #1C1C23; border: 1px solid #2A2A33; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: #B9B9C4">JD</div>
      <div style="width: 44px; height: 44px; border-radius: 50%; background: #1C1C23; border: 1px solid #2A2A33; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: #B9B9C4">IB</div>
      <div style="width: 44px; height: 44px; border-radius: 50%; border: 1px dashed #3A3A46; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #6E6E7A">+</div>
      <div style="width: 44px; height: 44px; border-radius: 50%; border: 1px dashed #3A3A46; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #6E6E7A">+</div>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <a href="Main.dc.html" style="min-height: 56px; display: flex; align-items: center; justify-content: center; background: #C8FF4D; color: #0B0B0D; border-radius: 6px; font-size: 16px; font-weight: 700">Build the set</a>

  <button type="button" style="min-height: 44px; background: transparent; border: 1px solid #25252E; border-radius: 6px; color: #B9B9C4; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; cursor: pointer">SHOW QR CODE INSTEAD</button>

</div>




</body></html>
